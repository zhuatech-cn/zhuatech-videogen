services:
  api:
    build: ./backend
    environment:
      ZHUATECH_VIDEO_PROVIDER: ${ZHUATECH_VIDEO_PROVIDER:-local}
      ZHUATECH_VIDEO_BASE_URL: ${ZHUATECH_VIDEO_BASE_URL:-}
      ZHUATECH_VIDEO_MODEL: ${ZHUATECH_VIDEO_MODEL:-text-to-video-provider-model}
      ZHUATECH_VIDEO_API_KEY: ${ZHUATECH_VIDEO_API_KEY:-}
    ports: ["8080:8080"]
  web:
    image: nginx:1.27-alpine
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    ports: ["8088:80"]
